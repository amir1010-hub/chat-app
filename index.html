<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAN Chat</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">
    <!-- ЭКРАН АВТОРИЗАЦИИ -->
    <div id="auth-screen" class="screen">
        <div class="card">
            <h1>💬 LAN Chat</h1>
            <p class="subtitle">Прямой чат без сервера</p>
            
            <div id="auth-tabs">
                <button class="tab active" data-tab="login">Вход</button>
                <button class="tab" data-tab="register">Регистрация</button>
            </div>
            
            <!-- Форма входа -->
            <form id="login-form" class="auth-form">
                <input type="text" id="login-user" placeholder="Логин" required autocomplete="username">
                <input type="password" id="login-pass" placeholder="Пароль" required autocomplete="current-password">
                <button type="submit">Войти</button>
                <p id="login-error" class="error hidden"></p>
            </form>
            
            <!-- Форма регистрации -->
            <form id="register-form" class="auth-form hidden">
                <input type="text" id="reg-user" placeholder="Придумайте логин" required autocomplete="off" minlength="3" maxlength="20">
                <input type="password" id="reg-pass" placeholder="Придумайте пароль" required autocomplete="new-password" minlength="4">
                <input type="password" id="reg-pass2" placeholder="Повторите пароль" required>
                <button type="submit">Зарегистрироваться</button>
                <p id="reg-error" class="error hidden"></p>
            </form>
        </div>
    </div>
    
    <!-- ЭКРАН ЧАТА -->
    <div id="chat-screen" class="screen hidden">
        <div id="sidebar">
            <div id="user-info">
                <span id="current-user">👤</span>
                <button id="logout-btn" title="Выйти">🚪</button>
            </div>
            
            <div id="contacts-section">
                <h3>Контакты</h3>
                <div id="add-contact">
                    <input type="text" id="contact-input" placeholder="Логин друга" maxlength="20">
                    <button id="add-contact-btn">+</button>
                </div>
                <div id="contacts-list"></div>
                <p id="contacts-error" class="error hidden"></p>
            </div>
        </div>
        
        <div id="chat-area">
            <div id="chat-placeholder">
                <div class="big-icon">💬</div>
                <p>Выберите контакт слева или добавьте нового</p>
            </div>
            
            <div id="chat-window" class="hidden">
                <div id="chat-header">
                    <span id="chat-partner"></span>
                    <span id="connection-status" class="status-offline">⚫</span>
                </div>
                <div id="messages"></div>
                <div id="file-preview" class="hidden">
                    <span id="file-preview-name"></span>
                    <button id="file-preview-clear">✕</button>
                </div>
                <div id="input-area">
                    <label for="file-input" class="attach-btn" title="Прикрепить файл (до 5 МБ)">📎</label>
                    <input type="file" id="file-input" accept="image/*,.pdf,.doc,.docx,.txt,.zip,.rar">
                    <input type="text" id="msg-input" placeholder="Сообщение..." autocomplete="off">
                    <button id="send-btn">➤</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
<script src="js/config.js"></script>
<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script src="js/files.js"></script>
<script src="js/peer.js"></script>
<script src="js/chat.js"></script>

</body>
</html>
