<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101820">
  <title>Telegram · окно связи</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#101820;color:#e9f0f6;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}body{display:flex;flex-direction:column;height:100dvh}header{height:58px;flex:none;padding:0 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #263644;gap:12px}.brand{display:flex;align-items:center;gap:10px;font-weight:650;letter-spacing:.1px}.icon{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#269cdb}svg{width:19px;height:19px}small{display:block;font-size:10px;color:#93a6b7;font-weight:400;letter-spacing:.2px;margin-top:2px}.status{display:flex;align-items:center;gap:7px;color:#a9bac8;font-size:12px}.dot{width:6px;height:6px;border-radius:50%;background:#6ca386}.actions{display:flex;align-items:center;gap:17px}button{background:none;border:1px solid #354857;border-radius:8px;color:#dce8f1;padding:7px 11px;cursor:pointer}button:hover{background:#22303c}main{min-height:0;flex:1;background:#fff}iframe{display:block;width:100%;height:100%;border:0;background:white}@media(max-width:520px){header{padding:0 12px;height:54px}.status{font-size:0}.actions{gap:12px}small{font-size:9px}}
  </style>
</head>
<body>
  <header>
    <div class="brand"><span class="icon"><svg viewBox="0 0 24 24" fill="white" aria-hidden="true"><path d="M21.4 3.5 18 20c-.2 1-1 1.2-1.8.7l-5.1-3.8-2.5 2.4c-.3.3-.5.5-1 .5l.4-5.2L17.5 6c.4-.4-.1-.6-.6-.3L5.1 13.1 0 11.5c-1.1-.4-1.1-1.1.3-1.6L20.1 2.3c.9-.3 1.6.2 1.3 1.2Z"/></svg></span><span>Telegram Web<small>Неофициальный доступ через прокси</small></span></div>
    <div class="actions"><span class="status"><span class="dot" id="dot"></span><span id="status">Подключение…</span></span><button type="button" id="reload">Обновить</button></div>
  </header>
  <main><iframe id="telegram" title="Telegram Web" src="/a/" allow="clipboard-read; clipboard-write; fullscreen" referrerpolicy="no-referrer"></iframe></main>
  <script>
    document.getElementById('reload').onclick=()=>{document.getElementById('telegram').src='/a/'};
    fetch('/__health').then(r=>{if(!r.ok)throw Error();document.getElementById('status').textContent='Прокси подключён'}).catch(()=>{document.getElementById('status').textContent='Нет соединения';document.getElementById('dot').style.background='#dd7b76'});
  </script>
</body>
</html>
